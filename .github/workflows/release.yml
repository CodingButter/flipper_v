name: Release

# Push a tag like v0.1.0 to build for all three platforms in parallel
# and publish the artifacts to a GitHub Release. The workflow also runs
# on manual dispatch so we can re-build the latest tag from the UI.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_flag: '--linux'
          - os: windows-latest
            platform_flag: '--win'
          - os: macos-latest
            platform_flag: '--mac'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build renderer + main
        run: bun run build

      - name: Install AzureSignTool (Windows)
        if: matrix.os == 'windows-latest'
        run: dotnet tool install --global AzureSignTool

      - name: Package & publish to GitHub Release
        env:
          # electron-builder uploads the artifacts to the Release that
          # matches the pushed tag.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS keychain auto-discovery off — we don't have an Apple
          # Developer ID cert yet.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Azure Artifact Signing — build/sign.js no-ops when
          # AZURE_CERT_PROFILE_NAME is unset, so secrets missing →
          # unsigned build (does not fail).
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_CODE_SIGNING_NAME: ${{ secrets.AZURE_CODE_SIGNING_NAME }}
          AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
        # `npx` (Node) instead of `bunx --bun` (Bun) — electron-builder's
        # transitive bluebird + source-map-support combo crashes under
        # the Bun runtime ("Column must be greater than or equal to 0").
        # Node runs it cleanly across all three platforms.
        run: npx electron-builder ${{ matrix.platform_flag }} --publish always
