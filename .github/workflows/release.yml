name: Release

# Push a tag like v0.1.0 to build for all three platforms in parallel
# and publish the artifacts to a GitHub Release. The workflow also runs
# on manual dispatch so we can re-build the latest tag from the UI.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_flag: '--linux'
          - os: windows-latest
            platform_flag: '--win'
          - os: macos-latest
            platform_flag: '--mac'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build renderer + main
        run: bun run build

      # --- Non-Windows: build + publish in one shot --------------------
      - name: Build & publish (non-Windows)
        if: matrix.os != 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS keychain auto-discovery off — no Apple Developer ID
          # cert yet.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        # `npx` (Node) instead of `bunx --bun` (Bun) — electron-builder's
        # transitive bluebird + source-map-support combo crashes under
        # the Bun runtime ("Column must be greater than or equal to 0").
        run: npx electron-builder ${{ matrix.platform_flag }} --publish always

      # --- Windows: build unsigned, sign post-hoc, then upload ---------
      # Microsoft Trusted/Artifact Signing speaks a different API than
      # Azure Key Vault, so community `AzureSignTool` doesn't work here.
      # `Azure/trusted-signing-action` is the official path.
      - name: Build unsigned (Windows)
        if: matrix.os == 'windows-latest'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --publish never

      - name: Sign Windows EXEs (Trusted Signing)
        if: matrix.os == 'windows-latest'
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          files-folder: ./dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Regenerate latest.yml hashes (Windows)
        if: matrix.os == 'windows-latest'
        run: node build/regen-latest-yml.cjs

      - name: Upload Windows artifacts to release
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v")) {
            $tag = "v$(node -e 'console.log(require(\"./package.json\").version)')"
          }
          $files = Get-ChildItem dist -Include *.exe,*.blockmap,latest.yml -File -Recurse | ForEach-Object { $_.FullName }
          gh release upload $tag @files --clobber
