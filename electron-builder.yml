appId: com.codingbutter.flipperv
productName: Flipper V
copyright: Copyright © 2026 codingbutter
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
  - '!**/*.{md,map,ts}'
asar: true
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
win:
  target:
    - nsis
    - portable
linux:
  target:
    - AppImage
    - deb
  category: Utility
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: CodingButter
  repo: flipper_v
  releaseType: release
