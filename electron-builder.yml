appId: com.codingbutter.flipperv
productName: Flipper V
copyright: Copyright © 2026 codingbutter
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
  - '!**/*.{md,map,ts}'
asar: true
mac:
  category: public.app-category.developer-tools
  # Both Apple Silicon and Intel binaries so the same Release covers
  # every Mac. Universal would double the size of the single binary —
  # cheaper to ship two arch-specific artifacts.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
win:
  target:
    - nsis
    - portable
  signtoolOptions:
    sign: ./build/sign.js
linux:
  target:
    - AppImage
    - deb
  category: Utility
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: CodingButter
  repo: flipper_v
  releaseType: release
